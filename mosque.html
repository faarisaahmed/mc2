<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muslim Center of Greater Princeton · MasjidHub</title>
<meta name="description" content="The Muslim Center of Greater Princeton: a mosque, youth center, and community center open to all.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MasjidHub">
<meta property="og:title" content="Muslim Center of Greater Princeton · MasjidHub">
<meta property="og:description" content="The Muslim Center of Greater Princeton: a mosque, youth center, and community center open to all.">
<meta property="og:image" content="https://faarisaahmed.github.io/mc2/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="MasjidHub: One app. Every masjid.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a3622">
<meta name="apple-mobile-web-app-title" content="MasjidHub">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="color-scheme" content="light dark">
<script src="assets/js/boot.js"></script>
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<div class="subnav"><div class="wrap"><h1 id="sub-name">Mosque</h1><div class="right"><a class="btn sm gold" href="donate.html">Donate</a></div></div></div>
<main id="page"></main>
<script src="assets/js/data.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/db.js"></script>
<script>
(function () {
  const id = new URLSearchParams(location.search).get("id") || "mcgp";
  let m;
  const e = MH.esc;
  // Iqamah set by the mosque in its dashboard: "HH:MM", or "+N" minutes after the adhan.
  function iqamah(p, adhan) {
    const v = (m.iqamah || {})[p]; if (!v || !adhan || isNaN(adhan)) return null;
    if (v[0] === "+") return new Date(adhan.getTime() + (+v.slice(1)) * 60000);
    const [h, mi] = v.split(":").map(Number), d = new Date(adhan); d.setHours(h, mi, 0, 0); return d;
  }
  function jumuahTimes() { return (m.jumuah || []).map(v => { const [h, mi] = v.split(":").map(Number), d = new Date(); d.setHours(h, mi, 0, 0); return MH.fmtTime(d); }); }

  let shown = [];   // the event occurrences on the page, for the calendar and share menus
  function render() {
    m = Object.assign({ values: "", about: "", phone: "", website: "", address: "", features: [], pillars: [], education: [], services: [], contacts: [], social: [] },
      MH_DATA.mosques.find(x => x.id === id) || MH_DATA.mosques[0]);
    const hasIq = m.iqamah && Object.keys(m.iqamah).length, ju = jumuahTimes();
    const anns = (MH_DATA.announcements || []).filter(a => a.mosque === m.id);
    document.title = `${m.name} · MasjidHub`;
    document.getElementById("sub-name").textContent = m.short;
    const now = new Date(), t = MH.prayerTimes(now, m.lat, m.lng, Object.assign({}, MH.prefs, m.method ? { method: m.method } : {}));
    const next = MH.PRAYERS.filter(p => !p.notPrayer).find(p => t[p.id] > now);
    const to = new Date(now.getTime() + 14 * 86400000);
    const evs = MH.occurrences(now, to).filter(x => x.mosque.id === m.id && !["fajr-halaqa", "isha-halaqa", "jumuah"].includes(x.id));
    const seen = new Set(), upcoming = evs.filter(x => !seen.has(x.id) && seen.add(x.id)).slice(0, 6);
    shown = upcoming;

    document.getElementById("page").innerHTML = `
    <section class="tile dark" style="padding:52px 22px 56px">
      ${m.values ? `<p class="eyebrow">${e(m.values)}</p>` : ""}
      <h2 class="headline" style="font-size:clamp(2.1rem,5.4vw,3.8rem)">${e(m.name)}</h2>
      ${m.about ? `<p class="lead">${e(m.about)}</p>` : ""}
      <div class="cta-row">
        <a class="btn gold" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(m.address)}">Directions</a>
        ${m.phone ? `<a class="btn ghost" href="tel:${m.phone.replace(/\D/g, "")}">Call</a>` : ""}
        ${/^https?:\/\//.test(m.website) ? `<a class="chev" target="_blank" rel="noopener" href="${e(m.website)}">Official website</a>` : ""}
      </div>
      <div class="prayer-strip wrap" style="padding-bottom:0">${MH.PRAYERS.map(p => `<div class="p ${next && p.id === next.id ? "next" : t[p.id] < now ? "past" : ""}"><div class="n">${p.t}</div><div class="t">${MH.fmtTimeHtml(t[p.id])}</div>${iqamah(p.id, t[p.id]) ? `<div class="iq">Iqamah ${MH.fmtTime(iqamah(p.id, t[p.id]))}</div>` : ""}</div>`).join("")}</div>
      <p class="small" style="color:#c9d8ce;margin:14px 0 0">Adhan times calculated for the mosque's location, shown in your time zone${MH.tzName(now) ? ` (${e(MH.tzName(now))})` : ""}. ${hasIq ? `Iqamah times are set by ${e(m.short || m.name)}.` : `Iqamah times aren't listed yet; check with ${e(m.short || m.name)}.`}${ju.length ? ` <strong>Jumu'ah khutbah:</strong> ${ju.join(" · ")}.` : ""}</p>
    </section>

    ${anns.length ? `<section class="section" style="padding-bottom:0"><div class="wrap">${anns.map(a => `<div class="announce ${a.kind}" role="note">${MH.icon(a.kind === "news" ? "bell" : "alert")}<div><h3>${a.kind === "janazah" ? "Janazah: " : ""}${e(a.title)}</h3>${a.body ? `<p>${e(a.body)}</p>` : ""}</div></div>`).join("")}</div></section>` : ""}

    ${m.pillars.length || m.features.length ? `<section class="section">
      <div class="wrap">
        <div class="section-head"><p class="eyebrow">About</p><h2 class="title">Faith, community, education, and youth under one roof.</h2></div>
        <div class="grid">${m.pillars.map(p => `<div class="card"><h3>${e(p.t)}</h3><p class="muted">${e(p.d)}</p></div>`).join("")}</div>
        <div class="chips" style="margin-top:22px">${m.features.map(f => `<span class="pill">${e(f)}</span>`).join("")}</div>
      </div>
    </section>` : ""}

    <section class="section alt">
      <div class="wrap">
        <div class="section-head" style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><div><p class="eyebrow">Next two weeks</p><h2 class="title">Upcoming at ${e(m.short)}</h2></div><a class="chev" href="events.html">All events</a></div>
        <div class="grid" id="mosque-events">${upcoming.length ? "" : `<p class="muted">No events in the next two weeks.</p>`}${upcoming.map(x => `<div class="card"><a class="card-link" href="events.html?ev=${encodeURIComponent(x.key)}">
          <span class="pill">${x.start.toLocaleDateString(MH.uiLocale(), { weekday: "short", month: "short", day: "numeric" })} · ${MH.fmtTime(x.start)}</span>
          <h3 style="margin-top:10px">${e(x.title)}</h3><p class="muted small">${e(x.desc)}</p><p class="small">${MH.ageLabel(x)}${MH.audienceLabel(x) ? " · " + MH.audienceLabel(x) : ""}</p></a>
          ${MH.eventActions(x)}</div>`).join("")}</div>
      </div>
    </section>

    ${m.education.length ? `<section class="section">
      <div class="wrap">
        <div class="section-head"><p class="eyebrow">Education</p><h2 class="title">Keep learning.</h2></div>
        <div class="grid">${m.education.map(x => `<a class="card" href="${x.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><h3 style="color:var(--accent)">${e(x.t)} ›</h3><p class="muted">${e(x.d)}</p></a>`).join("")}</div>
      </div>
    </section>` : ""}

    ${m.services.length ? `<section class="section alt">
      <div class="wrap">
        <div class="section-head"><p class="eyebrow">Services</p><h2 class="title">Here for you.</h2></div>
        <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${m.services.map(x => `<a class="card" href="${x.url}" target="_blank" rel="noopener" style="padding:18px 20px;font-weight:600">${e(x.t)} ›</a>`).join("")}</div>
      </div>
    </section>` : ""}

    <section class="section">
      <div class="wrap two-col">
        <div><p class="eyebrow">Visit</p><h2 class="title">Contact &amp; location</h2>
          <p class="lead">${e(m.address)}</p>
          ${m.phone ? `<p style="font-size:1.1rem;margin:16px 0 0;display:flex;gap:8px;align-items:center">${MH.icon("phone")}<a href="tel:${m.phone.replace(/\D/g, "")}">${e(m.phone)}</a></p>` : ""}
          <p style="margin:10px 0 0">${m.social.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${e(s.t)}</a>`).join(" · ")}</p></div>
        <div class="panel">${m.email && !m.contacts.length ? `<div style="padding:10px 0"><div class="small muted">Email</div><a href="mailto:${e(m.email)}">${e(m.email)}</a></div>` : ""}${m.contacts.map(c => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="small muted">${e(c.t)}</div><a href="mailto:${c.v}">${e(c.v)}</a></div>`).join("")}
          ${m.id === "mcgp" ? `<p class="small muted" style="margin:14px 0 0">© 2018–2026 Muslim Center of Greater Princeton. Not-for-profit organization recognized as tax-exempt under IRS code section 501(c)(3).</p>` : ""}</div>
      </div>
    </section>`;
  }
  document.addEventListener("DOMContentLoaded", () => {
    render(); MH.onPrefs(render);
    MH.bindEventMenus(document.getElementById("page"), key => shown.find(x => x.key === key));
  });
})();
</script>
</body>
</html>
